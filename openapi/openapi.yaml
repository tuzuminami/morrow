openapi: 3.1.0
info:
  title: MORROW API
  version: 1.0.1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: "{protocol}://{host}"
    description: Configured MORROW server after database migration and authenticator configuration.
    variables:
      protocol:
        default: https
      host:
        default: morrow.local
paths:
  /healthz:
    get:
      operationId: health
      summary: Return process liveness without checking dependencies.
      responses:
        "200":
          description: Process is accepting HTTP requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /readyz:
    get:
      operationId: readiness
      summary: Return readiness only when PostgreSQL and the migration ledger are usable.
      responses:
        "200":
          description: PostgreSQL and migration ledger are ready for traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "503":
          $ref: "#/components/responses/Error"
  /v1/retention-rules:
    post:
      operationId: upsertRetentionRule
      summary: Upsert a tenant-scoped retention rule for a memory type and purpose.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionRuleRequest"
      responses:
        "200":
          description: Retention rule saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/consent-receipts:
    post:
      operationId: registerConsentReceipt
      summary: Register consent for a subject and purpose.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterConsentRequest"
      responses:
        "200":
          description: Consent receipt registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/memories:
    post:
      operationId: registerMemory
      summary: Store a typed memory when consent and retention permit it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMemoryRequest"
      responses:
        "200":
          description: Memory stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/memories/query:
    post:
      operationId: queryMemories
      summary: Query up to 100 active memories by tenant, subject, type, purpose, and policy reference.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryMemoryRequest"
      responses:
        "200":
          description: Active scoped memories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/ResultLimitExceeded"
  /v1/memories/{memoryId}/revoke:
    post:
      operationId: revokeMemory
      summary: Revoke a memory and remove retrievable content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeMemoryRequest"
      responses:
        "200":
          description: Memory revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
  /v1/deletion-requests:
    post:
      operationId: createDeletionRequest
      summary: Create an idempotent deletion request and revoke retrievable content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionRequestRequest"
      responses:
        "200":
          description: Deletion request completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/subjects/{subjectId}/export:
    get:
      operationId: exportSubjectMemories
      summary: Export up to 1000 active, unexpired memories for a subject within the authenticated tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subject export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/ResultLimitExceeded"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The configured authenticator must supply tenant, actor, and scopes plus
        a matching subject claim or an unexpired scope-limited subject delegation
        for subject operations. MORROW does not expose delegation issuance.
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Optional assertion checked against the authenticated tenant. It never selects a tenant.
      schema:
        type: string
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Authentication is missing, invalid, or failed closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ResultLimitExceeded:
      description: Request body or result set exceeds a V1 safety limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    RegisterConsentRequest:
      type: object
      required: [subjectId, purpose, scope, expiresAt]
      properties:
        subjectId:
          type: string
        purpose:
          type: string
        scope:
          type: array
          items:
            $ref: "#/components/schemas/MemoryType"
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
    RetentionRuleRequest:
      type: object
      required: [memoryType, purpose, ttlDays, deletionMode]
      properties:
        memoryType:
          $ref: "#/components/schemas/MemoryType"
        purpose:
          type: string
        ttlDays:
          type: integer
          minimum: 1
        deletionMode:
          type: string
          enum: [soft_delete, hard_delete]
      additionalProperties: false
    RegisterMemoryRequest:
      type: object
      required: [subjectId, type, purpose, policyRef, content, source, confidence, classification]
      properties:
        subjectId:
          type: string
        type:
          $ref: "#/components/schemas/MemoryType"
        purpose:
          type: string
        policyRef:
          type: string
        content:
          type: string
          maxLength: 16384
        source:
          type: object
        confidence:
          type: number
          minimum: 0
          maximum: 1
        classification:
          type: string
          enum: [public, internal, sensitive]
      additionalProperties: false
    QueryMemoryRequest:
      type: object
      required: [subjectId, type, purpose, policyRef]
      properties:
        subjectId:
          type: string
        type:
          $ref: "#/components/schemas/MemoryType"
        purpose:
          type: string
        policyRef:
          type: string
      additionalProperties: false
    RevokeMemoryRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
      additionalProperties: false
    DeletionRequestRequest:
      type: object
      required: [memoryId, reason]
      properties:
        memoryId:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      additionalProperties: false
    MemoryType:
      type: string
      enum: [episodic, fact, preference, relationship, instruction]
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
        meta:
          type: object
          required: [requestId, correlationId, apiVersion]
          properties:
            requestId:
              type: string
            correlationId:
              type: string
            apiVersion:
              type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items: {}
            correlationId:
              type: string
