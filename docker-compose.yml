services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MORROW_POSTGRES_DB:-morrow}
      POSTGRES_USER: ${MORROW_POSTGRES_USER:-morrow}
      POSTGRES_PASSWORD: ${MORROW_POSTGRES_PASSWORD:?Set MORROW_POSTGRES_PASSWORD in your shell or .env file}
    ports:
      - "54329:5432"
    volumes:
      - morrow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  morrow-postgres:
