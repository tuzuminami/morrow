services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morrow
      POSTGRES_USER: morrow
      POSTGRES_PASSWORD: morrow_dev_password
    ports:
      - "54329:5432"
    volumes:
      - morrow-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morrow -d morrow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  morrow-postgres:
