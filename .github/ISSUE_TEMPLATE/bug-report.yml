name: Bug report
description: Report a reproducible MORROW defect without personal data or secrets.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic fixtures only. Never include memories, consent receipts, database dumps, access tokens, or production logs.
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include MORROW version, Node/PostgreSQL version, and a redacted command or request.
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Impact assessment
      options:
        - label: This affects consent, tenant isolation, retention, deletion, export, audit, or migration integrity.
        - label: This affects a package consumer, CI workflow, release artifact, or production recovery path.
